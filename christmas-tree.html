<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy New Year</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Brush Script MT", "Segoe Script", "Monotype Corsiva", cursive;
  }
  #scene { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(() => {
  // ================== 全局参数（对齐原 pygame 版本） ==================
  const TAU = Math.PI * 2;
  let WIDTH = window.innerWidth;
  let HEIGHT = window.innerHeight;

  // 粒子数量（浏览器端按 60% 缩放，保持流畅）
  const TREE_POINTS   = 30000;
  const GROUND_POINTS = 2500;
  const STAR_POINTS   = 800;
  const HEART_POINTS  = 600;
  const SNOW2D_POINTS = 12;

  // 相机参数 —— 俯视
  const CAM_DIST   = 13.0;
  const CAM_HEIGHT = 6.0;
  const PITCH      = -0.25;
  const TREE_HEIGHT = 12.0;

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  function resize() {
    WIDTH = window.innerWidth;
    HEIGHT = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.floor(WIDTH * dpr);
    canvas.height = Math.floor(HEIGHT * dpr);
    canvas.style.width  = WIDTH + 'px';
    canvas.style.height = HEIGHT + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ================== 生成圣诞树粒子 ==================
  function genTreePoints() {
    const pts = [];
    const loops = 9;
    const spiralN = Math.floor(TREE_POINTS * 0.7);

    // 70% 螺旋灯带
    for (let i = 0; i < spiralN; i++) {
      const u = Math.random();
      const h = Math.pow(u, 1.6);            // 底部密、顶部稀
      const y = TREE_HEIGHT * h + 0.2;
      let baseR = Math.pow(1 - h, 1.1) * 3.2;
      const branchWave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      baseR *= (1.0 + 0.65 * branchWave);
      const t = u * loops * TAU;
      const angle = t + (Math.random() * 0.44 - 0.22);
      const r = baseR * (0.85 + Math.random() * 0.23);
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;

      // 中段更亮
      const midBoost = Math.max(0.15, 1.0 - Math.abs(h - 0.55) * 1.5);
      const g = Math.min(255, 155 + Math.floor(90 * midBoost) + (Math.random() * 35 - 15));
      const b = Math.min(255, 185 + Math.floor(70 * midBoost) + (Math.random() * 50 - 15));
      let R = 255, G = g, B = b;
      // 点缀更亮的小灯
      if (Math.random() < 0.08) {
        G = 255 - Math.floor(Math.random() * 35);
        B = 230 + Math.floor(Math.random() * 25);
      }
      pts.push([x, y, z, R|0, G|0, B|0]);
    }

    // 30% 随机填充，轮廓毛茸茸
    const fillN = TREE_POINTS - spiralN;
    for (let i = 0; i < fillN; i++) {
      const h = Math.pow(Math.random(), 1.9);
      const y = TREE_HEIGHT * h + 0.2 + (Math.random() * 0.16 - 0.08);
      let baseR = Math.pow(1 - h, 1.1) * 4.3;
      const branchWave = Math.max(0, Math.sin((h * 5.8 + 0.15) * TAU));
      baseR *= (1.0 + 0.65 * branchWave);
      const r = baseR * Math.sqrt(Math.random());
      const angle = Math.random() * TAU;
      const x = Math.cos(angle) * r + (Math.random() * 0.16 - 0.08);
      const z = Math.sin(angle) * r + (Math.random() * 0.16 - 0.08);
      const G = 165 + Math.floor(Math.random() * 60);
      const B = 190 + Math.floor(Math.random() * 60);
      pts.push([x, y, z, 255, G, B]);
    }
    return pts;
  }

  // ================== 地面光环（法阵盘子） ==================
  function genGroundPoints() {
    const pts = [];
    const rings = [4.6, 6.0, 7.4, 8.8, 10.2, 11.4];
    for (let i = 0; i < GROUND_POINTS; i++) {
      const ring = rings[Math.floor(Math.random() * rings.length)];
      const r = ring + gauss(0, 0.3);
      const theta = Math.random() * TAU;
      const x = Math.cos(theta) * r;
      const z = Math.sin(theta) * r;
      const y = -0.25;
      let c;
      if (Math.random() < 0.15) c = 235 + Math.floor(Math.random() * 21);
      else c = 190 + Math.floor(Math.random() * 45);
      pts.push([x, y, z, c, c, 255]);
    }
    return pts;
  }

  // 简易高斯分布（Box-Muller）
  function gauss(mean, sd) {
    const u1 = Math.random() || 1e-9;
    const u2 = Math.random();
    const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(TAU * u2);
    return mean + z * sd;
  }

  // ================== 空中 3D 小亮点 ==================
  function genStarPoints() {
    const pts = [];
    for (let i = 0; i < STAR_POINTS; i++) {
      const x = -18 + Math.random() * 36;
      const z = -18 + Math.random() * 36;
      const y = 3 + Math.random() * 15;
      const base = 215 + Math.floor(Math.random() * 41);
      pts.push([x, y, z, base, base, 255]);
    }
    return pts;
  }

  // ================== 树顶 3D 爱心 ==================
  function genHeartPoints() {
    const pts = [];
    const scale = 0.9;
    const topY = TREE_HEIGHT + 0.05;
    let guard = 0;
    while (pts.length < HEART_POINTS && guard < HEART_POINTS * 50) {
      guard++;
      const x = -1.3 + Math.random() * 2.6;
      const y = -1.4 + Math.random() * 2.8;
      const f = Math.pow(x*x + y*y - 1.0, 3) - x*x * Math.pow(y, 3);
      if (f <= 0.0) {
        const wx = x * scale * 0.8;
        const wy = topY + (y + 1.0) * scale * 0.5;
        const wz = -0.18 + Math.random() * 0.36;
        const dist = Math.sqrt(x*x + y*y);
        const factor = Math.max(0.35, 1.15 - 0.5 * dist);
        const R = 255;
        const G = Math.max(120, Math.min(255, Math.floor(130 * factor + 80)));
        const B = Math.max(120, Math.min(255, Math.floor(190 * factor + 70)));
        pts.push([wx, wy, wz, R, G, B]);
      }
    }
    return pts;
  }

  // ================== 前景 2D 大雪花 ==================
  let flakes = [];
  function initSnow2d() {
    flakes = [];
    for (let i = 0; i < SNOW2D_POINTS; i++) flakes.push(newFlake(true));
  }
  function newFlake(initial) {
    return {
      x: Math.random() * WIDTH,
      y: initial ? (-80 + Math.random() * 70) : (-80 - Math.random() * 70),
      r: 10 + Math.random() * 6,
      speed: 30 + Math.random() * 15
    };
  }
  function updateSnow2d(dt) {
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.y += f.speed * dt;
      if (f.y > HEIGHT + 50) flakes[i] = newFlake(false);
    }
  }
  function drawSnow2d() {
    for (const f of flakes) {
      const { x, y, r } = f;
      // 5 层同心圆光晕
      const rings = [
        [r * 1.30, 0.05],
        [r * 1.00, 0.08],
        [r * 0.75, 0.16],
        [r * 0.55, 0.33],
        [r * 0.45, 1.00],
      ];
      for (const [rr, a] of rings) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.arc(x, y, Math.max(0.5, rr), 0, TAU);
        ctx.fill();
      }
    }
  }

  // ================== 3D -> 2D 投影（俯视） ==================
  const cosP = Math.cos(PITCH);
  const sinP = Math.sin(PITCH);
  function project(x, y, z, angle) {
    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);
    const xz = x * cosA - z * sinA;
    const zz = x * sinA + z * cosA;
    const yp = y * cosP - zz * sinP - CAM_HEIGHT;
    let zp = y * sinP + zz * cosP + CAM_DIST;
    if (zp <= 0.1) return null;
    const f = (HEIGHT * 0.63) / zp;
    const sx = WIDTH / 2 + xz * f;
    const sy = HEIGHT / 2 - yp * f;
    return [sx, sy, zp];
  }

  // ================== 预生成所有粒子 ==================
  const tree = genTreePoints();
  const ground = genGroundPoints();
  const stars = genStarPoints();
  const heart = genHeartPoints();
  const all = tree.concat(ground, stars, heart);
  initSnow2d();

  // ================== 主循环 ==================
  let angle = 0;
  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    // 背景
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // 投影所有粒子到待绘制列表
    const drawList = [];
    for (let i = 0; i < all.length; i++) {
      const p = all[i];
      const pr = project(p[0], p[1], p[2], angle);
      if (pr) {
        const size = Math.max(1, Math.floor(3.6 - pr[2] * 0.13));
        drawList.push(pr[2], pr[0], pr[1], size, p[3], p[4], p[5]);
      }
    }

    // 转成对象数组并按 depth 降序（远的先画）
    // drawList 是扁平数组 [d0,sx0,sy0,sz0,r0,g0,b0, d1,sx1,...]
    const n = drawList.length / 7;
    const items = new Array(n);
    for (let i = 0; i < n; i++) {
      items[i] = [
        drawList[i*7],   // depth
        drawList[i*7+1], // sx
        drawList[i*7+2], // sy
        drawList[i*7+3], // size
        drawList[i*7+4], // r
        drawList[i*7+5], // g
        drawList[i*7+6], // b
      ];
    }
    items.sort((a, b) => b[0] - a[0]);

    // 批量绘制
    for (let i = 0; i < n; i++) {
      const s = items[i];
      const sx = s[1], sy = s[2];
      if (sx < 0 || sx > WIDTH || sy < 0 || sy > HEIGHT) continue;
      ctx.fillStyle = `rgb(${s[4]},${s[5]},${s[6]})`;
      ctx.beginPath();
      ctx.arc(sx, sy, s[3], 0, TAU);
      ctx.fill();
    }

    // 文字
    ctx.fillStyle = '#fff';
    ctx.font = 'italic 45px "Brush Script MT", "Monotype Corsiva", cursive';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Happy New Year', 40, HEIGHT / 3);
    ctx.fillText('X And H', 40, HEIGHT / 3 + 60);

    // 前景雪花
    updateSnow2d(dt);
    drawSnow2d();

    angle += 0.0045;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
